services:
  postgres:
    image: postgres:18.3
    container_name: ai-sql-postgres
    environment:
      POSTGRES_DB: ai_sql_demo
      POSTGRES_USER: ai_sql
      POSTGRES_PASSWORD: ai_sql
    ports:
      - "5462:5432"
    volumes:
      - ai_sql_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_sql -d ai_sql_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai-sql-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aisql.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGPASSFILE: /var/lib/pgadmin/pgpass
    ports:
      - "5051:80"
    volumes:
      - ./.docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./.docker/pgadmin/pgpass:/pgadmin4/pgpass_src:ro
      - ai_sql_pgadmin:/var/lib/pgadmin
    entrypoint: >
      /bin/sh -c "cp /pgadmin4/pgpass_src /var/lib/pgadmin/pgpass && chmod 600 /var/lib/pgadmin/pgpass && /entrypoint.sh"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        ai_sql_starter: ../libs/ai-sql-spring-boot-starter
    container_name: ai-sql-backend
    environment:
      SPRING_PROFILES_ACTIVE: container
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AI_SQL_OPENAI_BASE_URL: ${AI_SQL_OPENAI_BASE_URL:-https://models.inference.ai.azure.com}
      AI_SQL_DEFAULT_MODEL: ${AI_SQL_DEFAULT_MODEL:-gpt-4.1-mini}
      AI_SQL_TARGET_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_sql_demo
      AI_SQL_TARGET_DATASOURCE_USERNAME: ai_sql
      AI_SQL_TARGET_DATASOURCE_PASSWORD: ai_sql
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/ai-sql-schema-public.txt"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      additional_contexts:
        ai_sql_lib: ../libs/ai-sql-lib
        shared_components: ../libs/shared-components
      args:
        VITE_BACKEND_URL: http://localhost:4001
    container_name: ai-sql-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5002:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ai_sql_pgdata:
  ai_sql_pgadmin:
